  short_description: "AI独立完成建筑施工图初审并交付正式范本Word"
  default_prompt: "Use $building-review 由AI独立完整开展建筑专业施工图初审：逐张清点图纸，关闭事实、规则、计算、跨图与图形证据链，强制使用本地知识库A/B/C/D四层资料，只把ai_ready意见写入正式范本格式的【AI初审】Word并逐页验证；不得等待或虚构人工确认、复核、裁决，不得凭记忆补规范或越专业。"
policy:
  allow_implicit_invocation: true
